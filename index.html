<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Fear of The Beauty Parlour — Premiere</title>
<meta name="robots" content="noindex, nofollow">

<style>
  /* ===== RESET ===== */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;       /* no scroll, ever */
    background: #000;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .stage {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: #000;
    overflow: hidden;
  }

  /* ===== VIDEO LAYER (always full-bleed, sits underneath) ===== */
  .video-layer {
    position: absolute;
    inset: 0;
    z-index: 1;
    background: #000;
    overflow: hidden;
  }

  /* Full-bleed 16:9 cover trick */
  .video-layer iframe {
    position: absolute;
    top: 50%; left: 50%;
    width: 100vw;
    height: 56.25vw;        /* 16:9 */
    min-height: 100vh;
    min-width: 177.78vh;    /* 16:9 */
    transform: translate(-50%, -50%);
    border: none;
    pointer-events: none;   /* clicks pass through until revealed */
  }
  .stage.is-open .video-layer iframe {
    pointer-events: auto;
  }

  /* ===== FRAYED THREAD SEAM (hidden under curtains at rest) ===== */
  .seam {
    position: absolute;
    inset: 0;
    z-index: 2;
    background: #EDE6DA;
    filter: drop-shadow(0 0 10px rgba(0,0,0,0.55));
    clip-path: polygon(
      48.2% 0%,   51.8% 0%,
      45.2% 6%,   48.8% 6%,
      51.2% 13%,  54.8% 13%,
      47.2% 19%,  50.8% 19%,
      53.2% 27%,  56.8% 27%,
      46.2% 34%,  49.8% 34%,
      50.2% 42%,  53.8% 42%,
      44.2% 50%,  47.8% 50%,
      51.2% 58%,  54.8% 58%,
      47.2% 66%,  50.8% 66%,
      54.2% 74%,  57.8% 74%,
      48.2% 82%,  51.8% 82%,
      45.2% 90%,  48.8% 90%,
      48.2% 100%, 51.8% 100%
    );
  }

  /* ===== CURTAIN PANELS (the album cover, torn in two) ===== */
  .curtain {
    position: absolute;
    inset: 0;
    z-index: 3;
    background-image: url('./images/album-cover.jpg');
    background-size: cover;
    background-position: center;
    will-change: transform;
    animation: breathe 7s ease-in-out infinite;
  }

  .curtain-left {
    clip-path: polygon(
      0% 0%,
      50% 0%,
      47% 6%,   53% 13%,  49% 19%,  55% 27%,
      48% 34%,  52% 42%,  46% 50%,  53% 58%,
      49% 66%,  56% 74%,  50% 82%,  47% 90%,
      50% 100%,
      0% 100%
    );
    transform-origin: left center;
  }

  .curtain-right {
    clip-path: polygon(
      50% 0%,
      47% 6%,   53% 13%,  49% 19%,  55% 27%,
      48% 34%,  52% 42%,  46% 50%,  53% 58%,
      49% 66%,  56% 74%,  50% 82%,  47% 90%,
      50% 100%,
      100% 100%,
      100% 0%
    );
    transform-origin: right center;
  }

  /* Subtle ambient life while waiting for the click */
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.012); }
  }

  /* ===== OPEN STATE — the tear ===== */
  .stage.is-open .curtain-left {
    animation: tearLeft 1.15s cubic-bezier(0.65, 0, 0.35, 1) forwards;
  }
  .stage.is-open .curtain-right {
    animation: tearRight 1.15s cubic-bezier(0.65, 0, 0.35, 1) forwards;
  }

  @keyframes tearLeft {
    0%   { transform: translateX(0) rotate(0deg); }
    7%   { transform: translateX(-1.5%) rotate(-0.4deg); }   /* the fabric gives way */
    100% { transform: translateX(-100%) rotate(-1.3deg); }
  }
  @keyframes tearRight {
    0%   { transform: translateX(0) rotate(0deg); }
    7%   { transform: translateX(1.5%) rotate(0.4deg); }
    100% { transform: translateX(100%) rotate(1.3deg); }
  }

  .stage.is-open .curtain {
    animation-fill-mode: forwards;
  }
  .stage.is-open .curtain {
    pointer-events: none;
  }

  /* Once fully open, lift the curtains out of the render tree */
  .curtain.gone { visibility: hidden; }

  /* ===== REDUCED MOTION ===== */
  @media (prefers-reduced-motion: reduce) {
    .curtain { animation: none; }
    .stage.is-open .curtain-left,
    .stage.is-open .curtain-right {
      animation: none;
      transition: opacity 0.4s ease;
      opacity: 0;
    }
  }
</style>
</head>
<body>

  <div class="stage" id="stage" role="button" tabindex="0" aria-label="Press to begin the premiere">

    <div class="video-layer">
      <iframe
        id="filmFrame"
        title="Fear of The Beauty Parlour"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>

    <div class="seam" aria-hidden="true"></div>

    <div class="curtain curtain-left" id="curtainLeft" aria-hidden="true"></div>
    <div class="curtain curtain-right" id="curtainRight" aria-hidden="true"></div>

  </div>

<script>
  const VIDEO_ID = '_4Outuu6E0U';
  const stage = document.getElementById('stage');
  const frame = document.getElementById('filmFrame');
  const curtainLeft = document.getElementById('curtainLeft');
  const curtainRight = document.getElementById('curtainRight');

  // Build the embed src once, with this page's own origin (needed for postMessage control)
  frame.src = `https://www.youtube.com/embed/${VIDEO_ID}` +
    `?enablejsapi=1&autoplay=0&controls=1&rel=0&modestbranding=1` +
    `&iv_load_policy=3&cc_load_policy=0&playsinline=1` +
    `&origin=${encodeURIComponent(window.location.origin)}`;

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let triggered = false;

  function playFilm() {
    frame.contentWindow.postMessage(
      JSON.stringify({ event: 'command', func: 'playVideo', args: [] }),
      '*'
    );
  }

  function begin() {
    if (triggered) return;
    triggered = true;

    // The click itself is the required user gesture — sound is allowed to start now.
    playFilm();

    const delay = reduceMotion ? 250 : 1000;

    setTimeout(() => {
      stage.classList.add('is-open');

      if (!reduceMotion) {
        // Remove the panels from the render tree once their slide finishes
        curtainLeft.addEventListener('animationend', () => curtainLeft.classList.add('gone'), { once: true });
        curtainRight.addEventListener('animationend', () => curtainRight.classList.add('gone'), { once: true });
      } else {
        setTimeout(() => {
          curtainLeft.classList.add('gone');
          curtainRight.classList.add('gone');
        }, 450);
      }
    }, delay);
  }

  stage.addEventListener('click', begin);
  stage.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') begin();
  });
</script>

</body>
</html>
